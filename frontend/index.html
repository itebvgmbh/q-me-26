<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link href="/favicon.svg" rel="icon" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dranzeit">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- seiten-kopf: Titel, Beschreibung, Canonical, Vorschau – füllt vite.config.ts aus src/utils/seiten-kopf.ts -->
  <title>Dranzeit</title>
  <!-- /seiten-kopf -->
  <meta name="theme-color" content="#141414">

  <load src="head.html" />

  <!-- Ladeanzeige, bis die App geladen ist (auf dem Handy nach dem QR-Scan sonst sekundenlang leer) -->
  <style>
    .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: hsl(50 16% 92.5%); color: hsl(0 0% 7.8%); font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .boot-spin { width: 36px; height: 36px; border-radius: 50%; border: 4px solid hsl(0 0% 7.8% / 0.15); border-top-color: hsl(0 0% 7.8%); animation: boot-spin 0.8s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot" role="status">
      <span class="boot-spin" aria-hidden="true"></span>
      <span>Einen Moment …</span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
