  <style>
    .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: hsl(50 16% 92.5%); color: hsl(0 0% 7.8%); font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .boot-spin { width: 36px; height: 36px; border-radius: 50%; border: 4px solid hsl(0 0% 7.8% / 0.15); border-top-color: hsl(0 0% 7.8%); animation: boot-spin 0.8s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot" role="status">
      <span class="boot-spin" aria-hidden="true"></span>
