services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-qmedata-7c79e}
      FIREBASE_SERVICE_ACCOUNT_KEY_FILE: /run/secrets/q-me/firebase-service-account.json
    volumes:
      - ./secrets:/run/secrets/q-me:ro
      - backend_data:/app/.local_data

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  backend_data:
  caddy_data:
  caddy_config:
