# Prüft die Anbindung an PostgreSQL und die Schema-Fassungen (backend/tests/test_datenbank.py) gegen eine
# Wegwerf-Datenbank, die Syntax von deploy/datenbank.sh, dass niemand an der Speicher-Schicht vorbei auf Firestore
# zugreift, und den Vertrag der Speicher-Schicht gegen den Firestore-Emulator. Läuft, sobald sich Backend oder
# Datenbank-Skripte ändern;
# von Hand: Actions → Datenbank → Run workflow. Anleitung: requirements/eigene-datenbank.md (Stufe 0).
name: Datenbank

on:
  push:
    paths:
      - backend/**
      - deploy/datenbank.sh
      - deploy/update.sh
      - .github/workflows/datenbank.yml
  pull_request:
    paths:
      - backend/**
      - deploy/datenbank.sh
      - deploy/update.sh
      - .github/workflows/datenbank.yml
  workflow_dispatch:

jobs:
  datenbank:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Dieselbe Hauptversion wie auf dem Server
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: q_me_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python und Abhängigkeiten wie auf dem Server
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: Skripte fürs Ausrollen
        working-directory: deploy
        run: |
          bash -n datenbank.sh
          bash -n update.sh
          shellcheck -S warning datenbank.sh
      - name: Anbindung und Schema
        env:
          QME_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/q_me_test
        run: .venv/bin/python tests/test_datenbank.py
      - name: Kein Zugriff an der Speicher-Schicht vorbei
        run: .venv/bin/python tests/test_speicher_gebuendelt.py
      - name: Live-Daten für Nummer und Bildschirm (app/apis/live)
        run: .venv/bin/python tests/test_live.py
      - name: Termine des Teams (app/apis/team_termine)
        run: .venv/bin/python tests/test_team_termine.py
      - name: Team und Leistungen (app/apis/team_laden)
        run: .venv/bin/python tests/test_team_laden.py
      - name: Pausen (app/apis/pausen)
        run: .venv/bin/python tests/test_pausen.py

  # Vertrag der Speicher-Schicht (backend/tests/test_speicher_vertrag.py) gegen den Firestore-Emulator: hält fest, wie
  # sich der genutzte Teil von Firestore verhält. In Stufe 3 muss PostgreSQL dieselben Verträge bestehen.
  vertrag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/regeln/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Python und Abhängigkeiten wie auf dem Server
        working-directory: backend
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: Firebase-Emulator (aus dev/regeln)
        working-directory: dev/regeln
        run: npm ci
      - name: Vertrag gegen Firestore
        working-directory: dev/regeln
        run: >-
          npx firebase emulators:exec --only firestore --project demo-dranzeit
          "../../backend/.venv/bin/python ../../backend/tests/test_speicher_vertrag.py"
