# Schema-Änderungen der Datenbank (requirements/eigene-datenbank.md). Die Adresse kommt aus QME_DATABASE_URL
# (migrations/env.py), nicht aus dieser Datei. Auf dem Server: bash /opt/q-me/deploy/datenbank.sh migrieren
# Neue Fassung anlegen: cd backend; .venv/bin/python -m alembic revision -m "kurzer Name"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
